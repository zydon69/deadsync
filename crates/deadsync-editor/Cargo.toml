[package]
name = "deadsync-editor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Lossless chart editing and GrooveAuthor functionality for DeadSync"

[features]
test-support = []
assistant-audio = ["dep:deadsync-audio-analysis", "dep:sha2"]

[dependencies]
deadsync-audio-analysis = { path = "../deadsync-audio-analysis", optional = true }
subtle = "2.6.1"
sha2 = { version = "0.11.0", optional = true }
unicode-segmentation = "1.13.3"
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
rssp = { git = "https://github.com/pnn64/rssp", branch = "main" }
lzma-rs = "0.3.0"
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_ToolHelp",
] }

[lints.clippy]
perf = { level = "warn", priority = -1 }
inline_always = "allow"

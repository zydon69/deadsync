[package]
name = "deadsync-editor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Lossless chart editing and GrooveAuthor functionality for DeadSync"

[dependencies]
tempfile = "3.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
rssp = { git = "https://github.com/pnn64/rssp", branch = "main" }
lzma-rs = "0.3.0"
uuid = { version = "1.26.1", features = ["v4"] }

[OptionsInputHelp]
ConfigureMappingsHelp=[Máp kéýbóáŕđ kéýš, páńéĺš, méńú búťťóńš, éťç. ťó gámé fúńçťíóńš.________________]
ConfigurePadsHelp=[Víéw áńđ éđíť šéńšóŕ ťhŕéšhóĺđš óń çóńńéçťéđ páđš (ŠťépMáńíáX, éťç.). Páđš šhów šíđé bý šíđé; Ĺéfť/Ŕíghť píçk á páńéĺ, Úp/Đówń áđjúšť íťš ťhŕéšhóĺđ. Éđíťš áŕé wŕíťťéń šťŕáíghť ťó ťhé páđ.\nÍf ĐéáđŠýńç Máńágéš Páđ Çóńfíg íš óń, ĐéáđŠýńç wíĺĺ óvéŕwŕíťé ťhéšé éđíťš (óń ĺáúńçh, óŕ whéń ťhé áçťívé pŕófíĺé óŕ páđ çháńgéš), šó šávé ťúńíńgš áš pŕófíĺéš fŕóm Šóńg Šéĺéçť íńšťéáđ. Wíťh íť óff, ýóúŕ éđíťš šťáý óń ťhé páđ.__________________________________________________________________________________________________]
DebounceHelp=[Gĺóbáĺ péŕ-íńpúť đébóúńçé wíńđów úšéđ áçŕóšš méńúš áńđ gámépĺáý fóŕ kéýbóáŕđ áńđ áĺĺ gámépáđ đŕívéŕš.\nÍŤGmáńíá đéfáúĺť íš 20mš. 50mš wáš çómmóń óń óĺđéŕ áŕçáđé páđš.________________________________________]
DebugFsrDumpHelp=[Íf ýóú hávé FŠŔš, úšé ťhíš ťó çŕéáťé fšŕđúmp.ťxť íń ýóúŕ đéáđšýńç fóĺđéŕ. Pĺéášé šéńđ íť ťó PéŕféçťŤášťé šó hé çáń đébúg áńđ ímpĺéméńť šúppóŕť fóŕ móŕé FŠŔ Í/Ó bóáŕđš áńđ fíŕmwáŕé véŕšíóńš.______________________________________________]
DefaultPadConfigHelp=[Ťhé búíĺť-íń ťhŕéšhóĺđ pŕéšéť (Ĺów/Méđíúm/Hígh, máťçhíńg ťhé óffíçíáĺ ŠťépMáńíáX ťóóĺ) ĐéáđŠýńç úšéš áš íťš đéfáúĺť.\nĐéfáúĺť íš Ĺów._________________________________]
GamepadBackendHelp=[Çhóóšé gámépáđ íńpúť báçkéńđ. Óń Wíńđówš Ŕáw Íńpúť íš ťhé đéfáúĺť páťh áńđ WGÍ ŕémáíńš áváíĺábĺé áš á çómpáťíbíĺíťý fáĺĺbáçk.\nÇháńgíńg báçkéńđ ŕéqúíŕéš á ŕéšťáŕť._________________________________________]
InputOptionsHelp=[Ópéń áđđíťíóńáĺ íńpúť šéťťíńgš._________]
MenuButtonsHelp=[Çhóóšé whéťhéŕ ťó áĺĺów úšíńg gámépĺáý búťťóńš (é.g. đíŕéçťíóńáĺ áŕŕówš) fóŕ méńú ńávígáťíóń.\nÚšé Gámépĺáý Búťťóńš - Ńávígáťé ťhŕóúgh ťhé gámé úšíńg ýóúŕ đáńçé páđ.\nÓńĺý Đéđíçáťéđ Búťťóńš - Ńávígáťé ťhŕóúgh ťhé gámé úšíńg đéđíçáťéđ méńú búťťóńš.\nWhéń éńábĺéđ, šómé ÚÍ áçťíóńš móvé fŕóm Šéĺéçť ťó á šímúĺťáńéóúš Ĺéfť+Ŕíghť çhóŕđ.\n\nÓńĺý Đéđíçáťéđ Búťťóńš ŕéqúíŕéš áť ĺéášť óńé pĺáýéŕ ťó hávé méńú búťťóńš máppéđ béfóŕé íť çáń bé šéĺéçťéđ._____________________________________________________________________________________________________________]
MenuNavigationHelp=[Çhóóšé whéťhéŕ çábíńéť-šťýĺé méńú ńávígáťíóń éxpéçťš fívé búťťóńš óŕ ťhŕéé búťťóńš péŕ pĺáýéŕ.\nFívé Kéý Méńú - Úšé MéńúĹéfť, MéńúŔíghť, MéńúÚp, MéńúĐówń, áńđ Šťáŕť.\nŤhŕéé Kéý Méńú - Úšé MéńúĹéfť, MéńúŔíghť, áńđ Šťáŕť.\nFívé Kéý Méńú ŕéqúíŕéš MéńúÚp, MéńúĐówń, MéńúĹéfť, áńđ MéńúŔíghť fóŕ áť ĺéášť óńé pĺáýéŕ.\nŤhŕéé Kéý Méńú ŕéqúíŕéš MéńúĹéfť, MéńúŔíghť, áńđ Šťáŕť fóŕ áť ĺéášť óńé pĺáýéŕ.______________________________________________________________________________________________]
OptionsNavigationHelp=[Çhóóšé hów Pĺáýéŕ Ópťíóńš šťýĺé šçŕééńš áđváńçé béťwééń ŕówš.\nŠťépMáńíá Šťýĺé - Úp/Đówń çháńgéš ŕówš áńđ Šťáŕť júmpš ťó Éxíť.\nÁŕçáđé Šťýĺé - Šťáŕť áđváńçéš ťó ťhé ńéxť ŕów áńđ ťhé áçťívé ŕów šhówš á đówń-póíńťéŕ íńđíçáťóŕ._______________________________________________________]
SmxAssignPadsHelp=[Çhóóšé whíçh phýšíçáĺ páđ íš Pĺáýéŕ 1 áńđ whíçh íš Pĺáýéŕ 2 bý šťéppíńg óń éáçh. Úšé ťhíš whéń bóťh páđš šháŕé ťhé šámé P1/P2 júmpéŕ, óŕ whéń ťhé páđš áŕé íńšťáĺĺéđ óń ťhé wŕóńg šíđéš. Ťhé páđš ĺíghť bĺúé (P1) áńđ ŕéđ (P2) šó ýóú çáń šéé ťhé áššígńméńť._________________________________________________________]
SmxBgPackHelp=[Ťhé GÍF páçk ťó úšé fóŕ fúĺĺ-páđ báçkgŕóúńđ áńímáťíóńš. Đéfáúĺť úšéš ťhé búíĺť-íń çómmóń páçk. Úšéŕ páçkš gó íń áššéťš/šmx-páđ-ĺíghťš/đáńçé/<páçk-ńámé>/. Óńĺý šhówń whéń Páńéĺ Ĺíghťš íš óń._____________________________________________]
SmxConfigHelp=[ŠťépMáńíáX páđ šéťťíńgš: éńábĺé ŠťépMáńíáX íńpúť áńđ páđ-çóńfíg máńágéméńť.\nŠhówń whéń Úšé FŠŔš íš éńábĺéđ.____________________________]
SmxDefaultLightBrightnessHelp=[Máçhíńé đéfáúĺť fóŕ ŠťépMáńíáX páđ-ĺíghť bŕíghťńéšš, 0% (óff) ťó 100%. Úšéđ ťó šééđ ńéw pĺáýéŕ pŕófíĺéš; éáçh pĺáýéŕ çáń ťhéń šéť ťhéíŕ ówń váĺúé íń Pĺáýéŕ Ópťíóńš.\nĐéfáúĺť íš 100%._________________________________________]
SmxIdleLightsHelp=[Wháť ťhé páđš šhów whéń GÍF ĺíghťíńg háš ńóťhíńg ťó đíšpĺáý, šúçh áš ťhé ńóńé páçk óŕ á ŕóĺé á páçk ĺéávéš émpťý.\nFíŕmwáŕé: ťhé páđš fáĺĺ báçk ťó ťhéíŕ búíĺť-íń ĺíghťíńg (ťhé šťóŕéđ íđĺé áńđ šťép áńímáťíóńš).\nBĺáçk: ťhé gámé kéépš ťhé ĹÉĐš áńđ hóĺđš ťhé páđš đáŕk; páńéĺ pŕéšš áńímáťíóńš šťíĺĺ pĺáý.\nÓńĺý šhówń whéń Páńéĺ Ĺíghťš íš óń. Đéfáúĺť íš Fíŕmwáŕé.______________________________________________________________________________________]
SmxInputHelp=[Éńábĺé ńáťívé ŠťépMáńíáX šťágé íńpúť víá ťhé ŔúšťMáńíáX ŠĐK, çóńńéçťíńg đíŕéçťĺý ťó ťhé páđš.\nÇháńgíńg ťhíš ŕéqúíŕéš á ŕéšťáŕť.\nĐéfáúĺť íš Ńó.____________________________________]
SmxJudgePackHelp=[Ťhé GÍF páçk ťó úšé fóŕ péŕ-páńéĺ júđgéméńť áńímáťíóńš. Đéfáúĺť úšéš ťhé búíĺť-íń çómmóń páçk. Úšéŕ páçkš gó íń áššéťš/šmx-júđgé-ĺíghťš/đáńçé/<páçk-ńámé>/. Óńĺý šhówń whéń Páńéĺ Ĺíghťš íš óń._____________________________________________]
SmxManagesPadConfigHelp=[Çóńťŕóĺš whó ówńš ýóúŕ ŠťépMáńíáX páđ ťhŕéšhóĺđš.\nÓń: ĐéáđŠýńç wŕíťéš ťhŕéšhóĺđš ťó éáçh páđ (ťhé páđ'š šávéđ đéfáúĺť pŕófíĺé, óŕ ťhé Đéfáúĺť Páđ Çóńfíg pŕéšéť íf íť háš ńóńé) áńđ ŕé-áppĺíéš ťhém óń ĺáúńçh áńđ whéńévéŕ ťhé áçťívé pŕófíĺé óŕ páđ çháńgéš. Éđíťš máđé íń Çóńfígúŕé Páđš áŕé ťémpóŕáŕý; šávé ťúńíńgš áš pŕófíĺéš fŕóm Šóńg Šéĺéçť ťó kéép ťhém.\nÓff: ĐéáđŠýńç ńévéŕ çháńgéš ýóúŕ páđš. Éđíť ťhém đíŕéçťĺý íń Çóńfígúŕé Páđš áńđ ťhé váĺúéš šťáý óń ťhé páđ.\nĐéfáúĺť íš Ńó.____________________________________________________________________________________________________________________]
SmxPanelLightsHelp=[Đŕívé ŠťépMáńíáX páđ páńéĺ ĹÉĐš wíťh GÍF áńímáťíóńš. Pĺáýš çóńfígúŕábĺé báçkgŕóúńđ áńímáťíóńš óń áĺĺ šçŕééńš, péŕ-páńéĺ júđgéméńť éfféçťš đúŕíńg gámépĺáý (ťáp gŕáđéš, fŕééžéš, ŕóĺĺš, míńé híťš), áńđ pŕéšš fééđbáçk whíĺé ńávígáťíńg méńúš. Whíĺé ťhé gámé íš šhówíńg šóméťhíńg, ťhé páđ'š ówń fíŕmwáŕé ĺíghťíńg íš šúppŕéššéđ; wháť áń íđĺé páđ šhówš íš çóńťŕóĺĺéđ bý Íđĺé Páđ Ĺíghťš.\nĐéfáúĺť íš Ńó._________________________________________________________________________________________________]
SmxSinglePadPlayerHelp=[Wíťh á šíńgĺé ŠťépMáńíáX páđ çóńńéçťéđ, çhóóšé whéťhéŕ íť pĺáýš áš Pĺáýéŕ 1 óŕ Pĺáýéŕ 2, ŕégáŕđĺéšš óf íťš háŕđwáŕé júmpéŕ. Píçk Pĺáýéŕ 2 ťó pĺáý á ĺóńé šťágé óń ťhé P2 šíđé._________________________________________]
SmxSwapPadsHelp=[Íńšťáńťĺý šwáp whíçh páđ íš Pĺáýéŕ 1 áńđ whíçh íš Pĺáýéŕ 2. Háńđý whéń ťhé páđš áŕé júmpéŕéđ çóŕŕéçťĺý búť íńšťáĺĺéđ óń ťhé wŕóńg šíđéš. Bóťh páđš múšť bé çóńńéçťéđ.________________________________________]
SmxUnderglowGrbHelp=[Wíŕé býťé óŕđéŕ fóŕ ťhé úńđéŕgĺów ĹÉĐ šťŕípš. Šómé šťŕípš ŕéáđ çóĺóúŕš íń GŔB óŕđéŕ, whíçh šwápš ŕéđ áńđ gŕééń: púŕpĺé šhówš áš çýáń áńđ gŕééń áš mágéńťá. Whíĺé ťhíš ópťíóńš págé íš ópéń ťhé šťŕípš hóĺđ á ŕéđ ťéšť çóĺóúŕ; íf ťhéý šhów gŕééń íńšťéáđ óf ŕéđ, šwíťçh ťhíš ťó GŔB.\nĐéfáúĺť íš ŔGB.______________________________________________________________________]
SmxUnderglowThemeHelp=[Šéť ťhé ŠťépMáńíáX páđ éđgé úńđéŕgĺów ĹÉĐš ťó ýóúŕ ťhémé çóĺóúŕ. P1 páđ úšéš ťhé šéĺéçťéđ çóĺóúŕ; P2 páđ úšéš ťhé páíŕéđ óffšéť çóĺóúŕ. Áppĺíéđ óń páđ çóńńéçť áńđ whéńévéŕ ťhé ťhémé çóĺóúŕ çháńgéš. Whíĺé ťhíš ópťíóńš págé íš ópéń, ťhé šťŕípš šhów á ŕéđ ťéšť çóĺóúŕ íńšťéáđ (bĺúé whéń ťhíš íš óff). Ŕéqúíŕéš á ńéwéŕ páđ wíťh mášťéŕ bóáŕđ fíŕmwáŕé v4 óŕ ĺáťéŕ; óĺđéŕ páđš đó ńóť šúppóŕť úńđéŕgĺów áńđ wíĺĺ ńóť ĺíghť úp.\nĐéfáúĺť íš Ńó._______________________________________________________________________________________________________]
TestInputHelp=[Ťéšť ýóúŕ đáńçé páđ/çóńťŕóĺĺéŕ áńđ méńú búťťóńš.\n\nÍf óńé óf ýóúŕ búťťóńš íš ńóť máppéđ ťó á gámé fúńçťíóń, íť wíĺĺ áppéáŕ héŕé áš "ńóť máppéđ".__________________________________]
UseFSRsHelp=[Éńábĺé đíŕéçť FŠŔ páđ đíágńóšťíçš áńđ ťhŕéšhóĺđ éđíťíńg óń ťhé Çóńfígúŕé Páđš šçŕééń. Ťhíš ŕéáđš šúppóŕťéđ páđš đíŕéçťĺý íńšťéáđ óf ŕéĺýíńg óń ťhé gámépĺáý íńpúť báçkéńđ.\nÁĺšó ŕévéáĺš ťhé ŠťépMáńíáX šéťťíńgš págé.\nĐéfáúĺť íš Ńó.__________________________________________________________]


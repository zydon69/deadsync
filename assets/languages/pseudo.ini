HighDPIHelp=[Éńábĺé ńáťívé Hígh-ĐPÍ/Ŕéťíńá ÓpéńGĹ fŕámébúfféŕš óń máçÓŠ.\nWáŕńíńg: ťhíš gŕéáťĺý íńçŕéášéš ťhé ńúmbéŕ óf píxéĺš ÓpéńGĹ múšť đŕáw óń Ŕéťíńá đíšpĺáýš áńđ çáń çáúšé šévéŕé FPŠ đŕópš íń méńúš óŕ fúĺĺ-šçŕééń fĺášhéš.\nŔéçómméńđéđ: Óff.__________________________________________________________]

FtueWelcome=Bienvenue
FtueIntro=Bienvenue dans l’éditeur. Ces six étapes configurent votre type de chart habituel, les décalages de synchronisation et les graphes chargés au démarrage. Utilisez Haut/Bas ou Tab pour choisir une ligne, puis Entrée pour continuer.
FtueChart=Quel type de chart utilisez-vous le plus ? Modifiez-le avec Gauche/Droite. Ce choix sert aussi à sélectionner le type de chart préféré à l’ouverture des musiques.
FtueNewSync=Choisissez le décalage de synchronisation des nouvelles musiques. Gauche/Droite modifie la valeur ; Maj permet un réglage plus fin ; I choisit 9 ms (ITG), D choisit 0 ms (DDR), H ouvre l’aide à la synchronisation. Les musiques existantes restent inchangées.
FtueOpenSync=Choisissez le décalage par défaut pour les musiques dont la synchronisation est inconnue. Gauche/Droite modifie la valeur ; Maj permet un réglage plus fin ; I choisit 9 ms (ITG), D choisit 0 ms (DDR), H ouvre l’aide à la synchronisation.
FtueGraphs=Choisissez les graphes à précharger pour générer des charts et des pas. Page précédente/suivante choisit un type ; Gauche/Droite active ou désactive son graphe. Charger moins de graphes réduit la mémoire utilisée. Les changements prennent effet après le redémarrage de l’application.
FtueFinal=La configuration est terminée. Vous pourrez modifier ces réglages dans les options générales. Les liens suivants ouvrent la documentation de référence et le dépôt de GrooveAuthor.
FtueBack=Retour
FtueNext=Suivant
FtueDone=Terminer
FtueReplay=Revoir l’introduction


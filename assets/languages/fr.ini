GameplayPadLightsHelp=Choisir le comportement lumineux des panneaux en jeu.\nEntrées : suivre les appuis physiques.\nChorégraphie : suivre les flèches, même sans appui sur le tapis.
SimplifyBassHelp=Faire clignoter les éclairages des basses uniquement sur les noires de la chorégraphie, comme LightsSimplifyBass dans ITGmania.\nActivé par défaut.

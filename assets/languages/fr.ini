[OptionsSyncPackHelp]
SyncPackPackHelp=Choisir les packs installés à synchroniser.\nTous les packs analyse l’ensemble de la bibliothèque ; un choix précis limite l’analyse à ce pack.
SyncPackStartHelp=Ouvrir la vérification locale de synchronisation pour les packs choisis.\nTous les packs analyse tous les packs installés en une passe.


; ============================================================
; Options screen - help text for each category
; ============================================================
[OptionsHelp]
ArcadeOptionsHelp=Configurer le monnayeur, les crédits, le nombre de morceaux par partie et les sessions chronométrées Premium Free.
BookkeepingHelp=Consulter les compteurs cumulés de pièces et de parties de cette machine.
SystemOptionsHelp=Choisir le type de jeu, le thème, la langue et les autres paramètres généraux.
GraphicsOptionsHelp=Régler le format d’écran, la résolution, la qualité graphique et la synchronisation visuelle.
SoundOptionsHelp=Régler la sortie audio et les sons de retour.
InputOptionsHelp=Configurer les commandes et diagnostiquer les contrôleurs.
LightsOptionsHelp=Configurer l’éclairage de la borne et des contrôleurs.
MachineOptionsHelp=Choisir les écrans affichés au démarrage et à la fin d’une session.
GameplayOptionsHelp=Régler la présentation pendant le jeu.
TournamentModeOptionsHelp=Configurer les règles imposées sur cette machine en mode tournoi.
SelectMusicOptionsHelp=Régler le comportement et l’affichage de l’écran de sélection des morceaux.
AdvancedOptionsHelp=Régler les conditions d’échec, le cache et l’analyse des fichiers pour cette machine.
CourseOptionsHelp=Régler la sélection et le déroulement des parcours.
ManageLocalProfilesHelp=Créer, modifier et gérer les profils de joueurs enregistrés sur cet ordinateur.\n\nUn clavier est nécessaire pour utiliser cet écran.
OnlineScoreServicesHelp=Configurer les services de scores en ligne et les outils d’importation.
DownloadPacksHelp=Parcourir et installer les packs de StepManiaOnline. Rechercher parmi des milliers de packs communautaires, consulter leur taille et leur contenu, puis les télécharger dans le dossier des morceaux.
NullOrDieOptionsHelp=Configurer l’analyse de null-or-die et les outils de synchronisation par lots.
FoldersOptionsHelp=Afficher les emplacements des données de DeadSync sur cet ordinateur. Chaque ligne ouvre le dossier correspondant dans l’explorateur de fichiers.
ReloadSongsCoursesHelp=Recharger tous les morceaux et parcours depuis le disque sans redémarrer le jeu.
CheckForUpdatesHelp=Rechercher immédiatement une nouvelle version sur GitHub. Ouvrir le panneau de mise à jour pour consulter et installer la version disponible.
RollBackVersionHelp=Revenir à une version antérieure. Consulter les versions récentes publiées sur GitHub, puis télécharger et installer l’une des versions précédant celle utilisée.
DownloadVideoSupportHelp=Télécharger les outils ffmpeg et ffprobe nécessaires aux fonds vidéo. Ils proviennent d’une distribution tierce de confiance et sont vérifiés avant installation.
CreditsHelp=Consulter les crédits de DeadSync et du projet.
ExitHelp=Revenir au menu principal.
ExitSubHelp=Revenir à la liste principale des options.
ThemeHelp=Enregistré dans deadsync.ini pour compatibilité ; le changement de thème n’est pas encore disponible.
LanguageHelp=Le changement est immédiat et enregistré dans deadsync.ini.


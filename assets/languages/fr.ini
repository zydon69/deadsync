; ============================================================
; Options Help — Select Music submenu
; ============================================================
[OptionsSelectMusicHelp]
GolfLeaderboardHelp=Le golf affiche les scores d’événement ArrowCloud, qui peuvent différer de l’affichage natif du golf.

ShowBannersHelp=Afficher les bannières des morceaux et packs, ou les remplacer par des bannières colorées.
ShowVideoBannersHelp=Animer les bannières MP4 lorsque la sélection est stabilisée.\nSi désactivé, afficher uniquement leur aperçu en cache.
ShowBreakdownHelp=Afficher ou masquer le détail des séquences continues dans la sélection des morceaux.
BreakdownStyleHelp=Choisir le format du détail des séquences.\nSL utilise le format Simply Love.\nSN utilise le format Stamina Nation.
ShowNativeLanguageHelp=Choisir l’affichage des titres dans la liste.\nTranslittération utilise les titres transcrits s’ils existent ; Originale conserve l’écriture d’origine.
MusicWheelSpeedHelp=Régler la vitesse de défilement lorsque la touche est maintenue.\nValeurs : Lente=5, Normale=10, Rapide=15, Très rapide=25, Extrême=30, Démesurée=45, Fulgurante=100.
MusicWheelStyleHelp=Choisir l’affichage des packs ouverts.\nITG garde les en-têtes des autres packs visibles.\nIIDX ne conserve que l’en-tête du pack actif.
DifficultyColorsHelp=Choisir les couleurs des difficultés indépendamment du thème actif.\nSimply Love suit la couleur du thème ; ITG et DDR utilisent leurs palettes d’arcade fixes.
HideInactiveSeriesHelp=Masquer les dossiers de séries inactives pendant la consultation d’une série ou d’un pack.\nS’applique aux styles de liste ITG et IIDX.
DefaultSortHelp=Choisir le tri utilisé à l’ouverture de la sélection des morceaux.\nDernier utilisé mémorise le dernier tri standard choisi dans le menu de tri entre les sessions.
SeriesSourceHelp=Choisir l’origine des noms de séries.\npack.ini utilise la valeur Series de la section [Group].\nDossier utilise un seul niveau supplémentaire : Songs/Series/Pack/Song.
SongSelectBGHelp=Choisir l’image de fond des éléments de la liste.\nDésactivé masque l’image. Bannière privilégie les bannières puis les fonds. Fond fait l’inverse.
SwitchProfileHelp=Afficher Changer de profil dans le menu de tri.
ShowCdTitlesHelp=Afficher ou masquer les logos CDTitle dans la sélection des morceaux.
ShowWheelGradesHelp=Afficher ou masquer les notes obtenues dans la liste.
ShowWheelLampsHelp=Afficher ou masquer les indicateurs de réussite dans la liste.
ITLRankHelp=Choisir le rang ITL affiché dans la liste.\nAucun masque le rang.\nChorégraphie affiche votre place dans son classement ITL.\nGlobal classe cette chorégraphie parmi vos chorégraphies ITL selon les points du tournoi, avec la même séparation Single/Double que Zmod.
WheelScoresHelp=Afficher les pourcentages sur aucun morceau, ceux d’événement uniquement ou tous.\nITL utilise EX et Stamina RPG le score ITG normal. Notes et indicateurs de réussite ont leurs propres réglages.
WheelScoreTypeHelp=Choisir le score des morceaux hors ITL et Stamina RPG.\nNormal utilise ITG ; EX et HEX utilisent leurs propres formules.
WheelShowFailsHelp=En l’absence de réussite, afficher en rouge le meilleur score local échoué.\nLes réussites sont prioritaires. Les échecs en ligne ne sont jamais affichés.
WheelItlPointsHelp=Afficher les points au-dessus des scores ITL réussis.\nMasqués pour les échecs et lorsque deux joueurs sont présents.
NewPackBadgeHelp=Afficher NOUVEAU sur les packs en tri par groupe.\nÀ l’ouverture du pack retire l’indicateur dès son ouverture.\nJusqu’au premier score le conserve tant qu’aucun joueur présent n’a de score local ou importé en cache pour ce pack.\nDésactivé masque l’indicateur et considère les nouveaux packs comme vus.
FolderStatsHelp=Afficher les statistiques de réussite du dossier en haut à droite.\nCompte les chorégraphies de la difficulté sélectionnée dans le pack, avec les scores en cache locaux, GrooveStats et ArrowCloud.
ShowPatternInfoHelp=Choisir entre les informations techniques, d’endurance ou la détection automatique.\nTechnique est recommandé.
StepArtistBoxHelp=Choisir la disposition de l’encadré du chorégraphe.\nPar défaut suit le thème. Classique utilise la petite ligne Simply Love. Étendu utilise le grand encadré multiligne ArrowCloud pour un joueur.
ChartInfoHelp=Choisir les mesures affichées au-dessus du détail des séquences.\nGauche/Droite choisit le pic de notes/s, le pic d’eBPM ou l’indice Matrix ; Start active chaque mesure.\nAu moins une reste active.
MusicPreviewsHelp=Activer ou désactiver les extraits musicaux.
PreviewMarkerHelp=Afficher une ligne blanche sur le graphique de densité à la position actuelle de l’extrait.\nVisible uniquement pendant la lecture d’un extrait.
LoopMusicHelp=Lire les extraits en boucle ou une seule fois.
PreviewStartsImmediatelyHelp=Lire les extraits dès l’arrivée sur la sélection des morceaux, ou seulement après le premier déplacement dans la liste.
ShowGameplayTimerHelp=Afficher le temps de la session dans la sélection des morceaux.
ShowStageDisplayHelp=Afficher le numéro d’étape sous l’en-tête de sélection des morceaux.
ShowGsBoxHelp=Afficher l’encadré GS dans les panneaux de sélection et de scores si disponible.\nExige un service GrooveStats, BoogieStats ou ArrowCloud activé et connecté.
GsBoxPlacementHelp=Auto conserve les règles de positionnement actuelles.\nPanneau des pas place toujours l’encadré GS au-dessus de ce panneau.
GsBoxLeaderboardsHelp=Choisir les classements affichés en alternance dans l’encadré GS.\nGauche/Droite choisit ITG/EX/H.EX/Tournois ; Start active chaque choix.

; ============================================================
; Options Help — Advanced submenu
; ============================================================
[OptionsAdvancedHelp]
DefaultFailTypeHelp=Choisir le comportement lorsque la vie atteint zéro.\nArrêt immédiat : passer aux résultats dès que tous les joueurs ont échoué.\nContinuer jusqu’à la fin : terminer le morceau malgré l’échec.\nValeur par défaut recommandée : continuer jusqu’à la fin.
BannerCacheHelp=Activer ou désactiver le cache des bannières sur disque.\nActivé par défaut (BannerCache=1).
CdTitleCacheHelp=Activer ou désactiver le cache des textures brutes CDTitle sur disque.\nActivé par défaut (CDTitleCache=1).
SongParsingThreadsHelp=Définir le nombre de threads d’analyse des fichiers de pas au démarrage.\nAuto par défaut (SongParsingThreads=0).
CacheSongsHelp=Activer ou désactiver l’écriture et l’utilisation du cache des informations de morceaux.\nActivé par défaut (CacheSongs=1).
FastLoadHelp=Réduire le travail bloquant au démarrage grâce au chargement rapide.\nActivé par défaut (FastLoad=1).
AllowSongDeletionHelp=Autoriser la suppression définitive d’un morceau avec Ctrl+Retour arrière dans la liste.\nDésactivé par défaut (AllowSongDeletion=0).

; ============================================================
; Options Help — Course submenu
; ============================================================
[OptionsCourseHelp]
ShowRandomCoursesHelp=Afficher les parcours contenant des étapes aléatoires, par exemple RANDOM/group/*.
ShowMostPlayedHelp=Afficher les parcours contenant des sélections MostPlayed/BEST.
ShowIndividualScoresHelp=Si désactivé, masquer les pages de scores par morceau aux résultats et à la fin du parcours.
AutosubmitIndividualHelp=Envoyer séparément le score de chaque chorégraphie du parcours aux services actifs. Chacune est évaluée avec sa propre barre de vie, initialisée à 50 %.
AutosubmitPostFailPassesHelp=Envoyer les morceaux suivants réussis avec une barre de vie indépendante, même après l’échec du parcours. Le parcours reste échoué.

; ============================================================
; Options Help — GrooveStats / ArrowCloud submenu
; ============================================================
[OptionsGrooveStatsHelp]
EnableGolfHelp=Activer les scores et résultats de golf, les indicateurs de par et les classements Golf (ArrowCloud). Réglez les affichages dans les options avancées du joueur et les pars/classements dans la sélection des morceaux. Désactiver masque et arrête ces fonctions tout en conservant les choix enregistrés.
EnableGrooveStatsHelp=Activer la connexion aux services GrooveStats.
ShowSRPGShopHelp=Afficher la boutique SRPG10 dans le menu de tri.\nNécessite Username et Password dans le fichier groovestats.ini du profil actif.
SRPGShopFolderHelp=Choisir le dossier des morceaux achetés dans SRPG10.\nPar faction crée des packs FE, DPRT, SN et NEP séparés. Option masquée si la boutique est désactivée.
EnableBoogieStatsHelp=Utiliser les adresses BoogieStats à la place de GrooveStats.\nNécessite GrooveStats activé.
AutoPopulateScoresHelp=Importer les notes, indicateurs de réussite et scores GS après réception des classements.
AutoDownloadUnlocksHelp=Télécharger automatiquement les packs débloqués lors de l’envoi de scores d’événement à GrooveStats.\nActive Voir les téléchargements dans le menu de tri lorsque le service est connecté.
SeparateUnlocksByPlayerHelp=Télécharger les packs débloqués dans des dossiers propres aux joueurs plutôt que dans un dossier partagé.\nCorrespond au réglage SeparateUnlocksByPlayer de Simply Love.
EnableArrowCloudHelp=Activer la connexion aux services ArrowCloud.
ArrowCloudSubmitFailsHelp=Envoyer aussi les étapes échouées à ArrowCloud.\nDésactivé par défaut.
ArrowCloudResultDialogsHelp=Télécharger et afficher les messages reçus après un envoi réussi à ArrowCloud.\nGauche/Droite change de page ; Start/Back ferme ; Select prend une capture.\nActivé par défaut.
ArrowCloudQRLoginHelp=Choisir quand afficher la connexion ArrowCloud par QR code après le choix du profil.\n\nToujours : à chaque fois.\nSi nécessaire : si un joueur présent n’a pas de clé API enregistrée.\nJamais : aucun affichage automatique. La liaison manuelle reste possible dans la gestion des profils.
GrooveStatsQRLoginHelp=Choisir quand afficher la connexion GrooveStats par QR code après le choix du profil.\n\nToujours : à chaque fois.\nSi nécessaire : si un joueur présent n’a pas de clé API enregistrée.\nJamais : aucun affichage automatique. La liaison manuelle reste possible dans la gestion des profils.

; ============================================================
; Options Help — Online Scoring submenu
; ============================================================
[OptionsOnlineScoringHelp]
GsBsOptionsHelp=Ouvrir les réglages GrooveStats / BoogieStats.
ArrowCloudOptionsHelp=Ouvrir les réglages ArrowCloud.
ScoreImportHelp=Ouvrir les outils d’importation et choisir le service et le profil.
ShareRipsHelp=Partager les tirages de packs générés dans Trouver du contenu avec la liste récente d’itgcontent.net, et indiquer ceux que vous conservez.\nSeuls la demande du tirage et les morceaux trouvés sont envoyés. Aucune donnée sur vous ou vos profils n’est transmise.\nActivé par défaut.
NullOrDieOptionsHelp=Ouvrir les réglages d’affichage et de confiance de l’analyse null-or-die.
SyncPacksHelp=Ouvrir la synchronisation par lots de tous les fichiers ou d’un pack installé.\nUn panneau local de vérification s’ouvre après le choix de la cible.

; ============================================================
; Options Help — Null-or-Die submenu
; ============================================================
[OptionsNullOrDieHelp]
SyncGraphHelp=Choisir le graphique null-or-die du panneau de synchronisation.\nFréquence : accumulateur spectral pondéré.\nIndice du temps : synthèse par temps sur la durée.\nEmpreinte après convolution : carte thermique avec la réponse finale du noyau.
GraphOrientationHelp=Choisir l’axe des lignes du graphique null-or-die.\nVerticale conserve la fréquence ou l’indice du temps sur l’axe vertical.\nHorizontale les place sur l’axe horizontal.
GraphOriginHelp=Choisir la position du début du morceau dans les graphiques verticaux.\nBas correspond au comportement natif de nine-or-null et à la valeur par défaut.
SyncConfidenceHelp=Définir la confiance minimale pour enregistrer la synchronisation d’un pack.\nLes résultats sous ce seuil sont analysés et affichés mais ignorés à l’enregistrement.\nPour un seul morceau, l’enregistrement reste possible avec un avertissement.
CacheResultsHelp=Réutiliser les analyses null-or-die terminées entre les sessions.\nSi désactivé, chaque synchronisation relance l’analyse et les nouveaux résultats ne sont pas mis en cache.\nActivé par défaut (NullOrDieCacheResults=1).
PackSyncThreadsHelp=Définir le nombre de threads pour l’analyse des packs.\nAuto utilise tous les cœurs logiques ; 1 utilise un seul thread.\nAuto par défaut (PackSyncThreads=0).
FingerprintHelp=Définir la largeur de l’empreinte autour de chaque temps pour estimer le décalage.\nUne valeur faible se concentre sur le temps ; une valeur élevée compare une zone plus large.
WindowHelp=Définir la fenêtre du spectrogramme en millisecondes.\nDétermine la quantité d’audio analysée par tranche FFT.
StepHelp=Définir le pas du spectrogramme en millisecondes.\nUne valeur faible augmente la densité d’analyse et son coût.
MagicOffsetHelp=Ajouter une correction fixe au décalage estimé final.\nUtile pour comparer différentes conventions de synchronisation sans modifier les fichiers de pas.
KernelTargetHelp=Appliquer le noyau aux données de synthèse ou d’accumulation.\nSynthèse est la valeur par défaut.
KernelTypeHelp=Choisir la forme du noyau de convolution.\nMontant est la valeur par défaut.
FullSpectrogramHelp=Autoriser l’empreinte par spectrogramme complet lorsque null-or-die l’estime adaptée.\nPeut augmenter la mémoire utilisée ou le travail d’analyse.


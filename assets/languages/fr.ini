[OptionsMachineHelp]
SelectProfileHelp=Afficher ou ignorer le choix du profil au démarrage.
SelectColorHelp=Afficher ou ignorer le choix de la couleur au démarrage.
PreferredColorHelp=Couleur utilisée si l’écran de choix est désactivé.
SelectStyleHelp=Afficher ou ignorer le choix du style au démarrage.
PreferredStyleHelp=Style utilisé si l’écran de choix est désactivé.
SelectPlayModeHelp=Afficher ou ignorer le choix du mode au démarrage.
PreferredModeHelp=Mode utilisé si l’écran de choix est désactivé.
MachineFontHelp=Choisir la famille de polices de la machine. Wendy est la valeur par défaut ; Mega remplace les titres et les chiffres.
BarColorHelp=Choisir le fond des barres d’écran. Par défaut, suivre le style visuel : transparent pour Technique, coloré pour SRPG9, comportement habituel pour les autres styles.
EvaluationStyleHelp=Choisir l’opacité des encadrés de résultats. Par défaut, ils sont transparents pour Technique et opaques pour les autres styles.
EvalSummaryHelp=Afficher ou ignorer le récapitulatif des résultats après la sélection des morceaux ou parcours.
EasterEggsHelp=Activer les surprises de Simply Love sur les résultats, dont les animations « You Tried » pour les marques Great et Excellent. La surprise « Nice » se règle séparément.
NiceSoundHelp=Afficher et jouer la surprise « Nice » lorsqu’un score contient 69.
NameEntryHelp=Afficher ou ignorer la saisie du nom après le récapitulatif.
GameoverScreenHelp=Afficher ou ignorer la fin de partie après la saisie du nom.
WriteCurrentScreenHelp=Écrire le nom de l’écran actif dans save/current_screen.txt à chaque transition.
MenuMusicHelp=Activer la musique en boucle des écrans de choix de couleur, de style et de mode.
VisualStyleHelp=Choisir le style visuel Simply Love des menus et de l’écran des couleurs.
ThemeVariantHelp=Choisir le thème d’endurance associé à l’icône de muscle : SRPG9, SRPG10 ou ECS15.
ReplaysHelp=Enregistrer les replays localement pendant le jeu.\nSi désactivé, l’option Lire le replay est masquée.
HeartRateMonitorsHelp=Activer la recherche Bluetooth des cardiofréquencemètres et leur sélection par joueur.
PerPlayerGlobalOffsetsHelp=Autoriser chaque profil à définir un décalage personnel dans ses options.\nIl s’ajoute au décalage global de la machine.
PackIniOffsetsHelp=Appliquer les valeurs SyncOffset de Pack.ini à la synchronisation du jeu.\nSi désactivé, ces données sont ignorées.
DefaultSyncOffsetHelp=Choisir le décalage supposé pour les packs sans valeur SyncOffset dans Pack.ini.
KeyboardFeaturesHelp=Activer les raccourcis clavier, comme Ctrl+R pour recommencer pendant le jeu ou les résultats.
VideoBgsHelp=Animer les vidéos de fond pendant le jeu.\nSi désactivé, afficher leur première image.
RandomMoviesHelp=Autoriser les vidéos du dossier RandomMovies lorsqu’un morceau n’a pas de changements de fond programmés ou demande -random-.
VersionOverlayHelp=Afficher discrètement la version dans un coin inférieur de chaque écran.\nUtile pour identifier la version dans les captures et vidéos ; peut être désactivé.
VersionOverlaySideHelp=Choisir le coin de l’écran pour le numéro de version. Sans effet si son affichage est désactivé.
ShowLocalIpHelp=Afficher l’adresse réseau locale préférée de cette machine en haut à gauche du menu principal.

; ============================================================
; Options Help — Gameplay submenu
; ============================================================
[OptionsGameplayHelp]
BgBrightnessHelp=Régler la luminosité du fond pendant le jeu.
CenteredP1NotefieldHelp=Centrer le terrain du joueur actif en mode solo.
NoteScrollClockHelp=Choisir l’horloge servant uniquement à placer visuellement les notes.\nAudio brut utilise directement la position audio.\nImages stabilisées lisse l’avancement et corrige progressivement vers l’audio pour réduire les micro-saccades.\nLes jugements, scores, replays et appuis utilisent toujours le temps audio brut.
AnimatedBannersHelp=Régler les bannières vidéo du panneau de statistiques.\nImage fixe utilise l’aperçu en cache. Lire une fois garde la dernière image. En boucle répète jusqu’à la fin du jeu.
ZmodRatingBoxHelp=Afficher la difficulté au style Zmod dans son encadré pendant le jeu et les résultats.
BpmDecimalHelp=Afficher jusqu’à trois décimales pour le BPM en jeu lorsqu’il n’est pas entier.
BpmPositionHelp=Choisir la position du BPM en direct. Près du terrain le place à côté du terrain solo actif.
DelayedBackHelp=Choisir comment BACK quitte un morceau.\nMaintenir : environ une seconde d’appui, comme ITGmania, par défaut.\nImmédiat : quitter dès le premier appui.
AutoScreenshotHelp=Capturer automatiquement l’écran des résultats.\nGauche/Droite choisit une condition, Start l’active.\nPBs : records personnels. Fails : échecs.\nClears : réussites sans record. Quads : 100 %. Quints : EX parfait.
DefaultJudgmentPaletteHelp=Choisir la palette utilisée par les profils réglés sur la valeur par défaut de la machine.
ManageJudgmentPalettesHelp=Créer, renommer, modifier ou supprimer des palettes de jugements.\nLa palette Simply Love intégrée reste en lecture seule.

[OptionsTournamentHelp]
EnableTournamentModeHelp=Activer les règles de tournoi Simply Love sans modifier les options enregistrées des joueurs.
ScoringSystemHelp=Choisir le score affiché pendant le jeu et les résultats. EX utilise le calcul Simply Love EX ; ITG utilise le pourcentage ITG classique.
StepStatsHelp=Imposer l’affichage ou le masquage du panneau de statistiques pour tous les joueurs.
EnforceNoCmodHelp=Sur les morceaux marqués « no cmod », convertir CMod en MMod équivalent pour cette partie. Les vitesses enregistrées ne changent pas.

[JudgmentPalettes]

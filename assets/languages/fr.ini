; ============================================================
[OptionsSystemHelp]
GameHelp=Choisir le jeu actif : dance utilise quatre panneaux par tapis, pump en utilise cinq.
ThemeHelp=Enregistré dans deadsync.ini pour compatibilité ; le changement de thème n’est pas encore disponible.
LanguageHelp=Le changement de langue est immédiat et enregistré dans deadsync.ini.
LogLevelHelp=Définir le niveau de détail des journaux.\nLe changement est immédiat et enregistré dans deadsync.ini.
LogFileHelp=Copier les journaux dans deadsync.log à la racine du jeu.\nSi désactivé, les journaux apparaissent uniquement dans le terminal.
DefaultScrollSpeedHelp=Choisir la vitesse de défilement par défaut pour les invités et les nouveaux profils.
DefaultScrollDirectionHelp=Choisir le sens de défilement par défaut pour les invités et les nouveaux profils.
DefaultBackgroundFilterHelp=Choisir le filtre de fond par défaut pour les invités et les nouveaux profils.
DefaultNoteSkinHelp=Choisir l’apparence des notes par défaut pour les invités et les nouveaux profils.\nDes réglages avancés peuvent être définis séparément dans save/default_player_options.ini.

; ============================================================
; Options Help — Graphics submenu
; ============================================================
[OptionsGraphicsHelp]
VideoRendererHelp=Choisir le moteur de rendu graphique.
SoftwareRendererThreadsHelp=Visible uniquement avec le rendu logiciel.\nDéfinir le nombre de threads processeur utilisés.
DisplayModeHelp=Choisir le mode d’affichage de la fenêtre.
DisplayAspectRatioHelp=Choisir le rapport largeur/hauteur du rendu.
DisplayResolutionHelp=Choisir la résolution de rendu.
RefreshRateHelp=Choisir la fréquence de rafraîchissement cible de l’écran.
FullscreenTypeHelp=Choisir le plein écran exclusif ou sans bordure.
PresentModeHelp=Définir quand les images calculées sont affichées.\n\nVSync : synchronise les images avec l’écran, évite le déchirement mais augmente la latence.\nMailbox : affiche la dernière image prête à chaque rafraîchissement avec moins de latence. Recommandé.\nImmédiat : affiche les images sans attendre, avec une latence minimale mais des déchirements ou des images fantômes, sauf vers 1 000 images/s.
MaxFpsHelp=Limiter les images/s en mode Mailbox ou Immédiat pour réduire la charge graphique, les sifflements électriques, la chaleur et le bruit des ventilateurs. Désactiver laisse le débit illimité.
MaxFpsValueHelp=Définir la limite d’images/s. Pour un jeu fluide, commencer vers trois fois la fréquence de l’écran : 180 images/s à 60 Hz ou 432 à 144 Hz.\nRéglage par pas de 1 image/s. Maintenez gauche ou droite pour accélérer.
ShowStatsHelp=Choisir les informations de performance : aucune, images/s seules, avec saccades ou avec timings.\nLe dernier mode ajoute les prédictions de présentation, les replis, la charge des files et les horloges.
ValidationLayersHelp=Activer les couches de validation Vulkan/D3D/OpenGL pour le diagnostic graphique.\nDésactivation recommandée : cette option peut diviser les images/s par deux.
HighDPIHelp=Activer les surfaces OpenGL haute résolution/Retina natives sur macOS.\nAttention : le nombre de pixels augmente fortement et peut réduire les images/s dans les menus ou les flashs plein écran.\nDésactivation recommandée.
HideMouseCursorHelp=Masquer le pointeur de la souris dans la fenêtre de DeadSync.
VisualDelayHelp=Appliquer un décalage visuel par pas de 1 ms.
OverscanAdjustmentHelp=Régler le centrage et l’échelle de l’image pour compenser\nles bords coupés par certains téléviseurs ou écrans.

; ============================================================
; Options Help — Sound submenu
; ============================================================
[OptionsSoundHelp]
SoundDeviceHelp=Choisir une sortie audio détectée au démarrage.\nAuto utilise la sortie par défaut du système.\nWindows privilégie WASAPI natif.\nmacOS privilégie CoreAudio natif.\nFreeBSD privilégie PCM/OSS natif.\nSous Linux, le routage dépend du système audio choisi ; le mode ALSA exclusif se règle séparément.\nPrend effet au prochain lancement.
AudioOutputModeHelp=Choisir le mode de sortie Auto ou Partagé.\nAuto conserve le comportement par défaut du système audio.\nPartagé force le partage de la sortie si disponible.\nLe mode exclusif est proposé séparément lorsque le système audio Linux est ALSA.\nPrend effet au prochain lancement.
AudioOutputModeWindowsHelp=Auto et Partagé utilisent une sortie partagée.\nExclusif réserve le périphérique audio à DeadSync.\nPrend effet au prochain lancement.
LinuxAudioBackendHelp=Choisir le système audio Linux à privilégier.\nLes choix dépendent des composants de cette version.\nAuto privilégie PulseAudio, puis ALSA et enfin JACK.\nPipeWire doit être sélectionné explicitement.\nPipeWire et PulseAudio partagent la sortie et ignorent actuellement le périphérique choisi.\nJACK offre une faible latence et ignore aussi ce choix.\nALSA fournit un accès direct et propose le mode exclusif.\nPrend effet au prochain lancement.
AlsaExclusiveHelp=Demander une sortie ALSA exclusive sur le périphérique choisi.\nDésactivé conserve le partage normal.\nActivé nécessite un périphérique hw/plughw direct ou un alias matériel valide.\nPrend effet au prochain lancement.
AudioSampleRateHelp=Choisir la fréquence d’échantillonnage de la sortie audio sélectionnée.
MasterVolumeHelp=Régler le volume général de tous les sons.
SfxVolumeHelp=Régler le volume des effets avant application du volume général.
AssistTickVolumeHelp=Régler le volume du métronome d’aide avant application du volume général.
MusicVolumeHelp=Régler le volume musical avant application du volume général.
MineSoundsHelp=Jouer un son lorsqu’une mine est touchée.
GlobalOffsetHelp=Appliquer un décalage global de synchronisation audio par pas de 1 ms.
RateModPreservesPitchHelp=Conserver la hauteur du son lorsque la vitesse de lecture change.
ReplayGainHelp=Expérimental : harmoniser le volume des morceaux avec ReplayGain 2.0 / EBU R 128. Chaque morceau est analysé une fois, puis le résultat est mis en cache. Les morceaux nouveaux ou modifiés sont analysés au démarrage et au rechargement ; la lecture utilise le gain enregistré. Pour analyser toute la bibliothèque immédiatement, utilisez Appliquer ReplayGain.
ApplyReplayGainHelp=Analyser maintenant le volume ReplayGain de toute la bibliothèque, sans attendre un redémarrage ou un rechargement. Affiche la progression et le temps estimé ; l’opération peut être annulée. Les morceaux déjà analysés sont ignorés.

; ============================================================
; Options Help — Input submenu
; ============================================================
[OptionsInputHelp]
ConfigureMappingsHelp=Associer les touches du clavier, les panneaux et les boutons de menu aux commandes du jeu.
TestInputHelp=Tester les tapis, contrôleurs et boutons de menu.\n\nUn bouton sans fonction attribuée apparaît comme « non attribué ».
ConfigurePadsHelp=Consulter et modifier les seuils des capteurs des tapis connectés. Gauche/Droite choisit un panneau, Haut/Bas règle son seuil. Les modifications sont écrites directement sur le tapis.\nSi DeadSync gère la configuration des tapis, ces valeurs seront remplacées au lancement ou lors d’un changement de profil ou de tapis : enregistrez alors vos réglages comme profils depuis la sélection des morceaux. Sinon, les valeurs restent sur le tapis.
InputOptionsHelp=Ouvrir les réglages supplémentaires des commandes.
GamepadBackendHelp=Choisir le système de gestion des manettes. Sous Windows, Raw Input est le choix par défaut et WGI reste disponible pour compatibilité.\nUn redémarrage est nécessaire.
SmxInputHelp=Activer la lecture native des tapis StepManiaX via RustManiaX SDK, avec une connexion directe aux tapis.\nUn redémarrage est nécessaire.\nDésactivé par défaut.
UseFSRsHelp=Activer le diagnostic direct et le réglage des seuils FSR dans Configurer les tapis, sans passer par le système de commandes utilisé en jeu.\nAffiche aussi les réglages StepManiaX.\nDésactivé par défaut.
SmxConfigHelp=Réglages des tapis StepManiaX : lecture native et gestion de leur configuration.\nVisible lorsque les capteurs FSR sont activés.
SmxManagesPadConfigHelp=Définir qui gère les seuils des tapis StepManiaX.\nActivé : DeadSync applique le profil par défaut du tapis, ou le préréglage de la machine à défaut, au lancement et à chaque changement de profil ou de tapis. Les réglages directs sont temporaires ; enregistrez-les comme profils depuis la sélection des morceaux pour les conserver.\nDésactivé : DeadSync ne modifie jamais les seuils. Les réglages effectués dans Configurer les tapis y restent enregistrés.\nDésactivé par défaut.
SmxPanelLightsHelp=Piloter les DEL des panneaux StepManiaX avec des animations GIF : fonds sur les écrans, jugements en jeu et retours d’appui dans les menus. Pendant ces animations, l’éclairage du micrologiciel est suspendu. L’option Éclairage au repos définit le comportement sans animation.\nDésactivé par défaut.
SmxUnderglowThemeHelp=Appliquer la couleur du thème aux bandes lumineuses du tapis StepManiaX. J1 utilise la couleur choisie, J2 la couleur associée. Mise à jour à la connexion et au changement de couleur. Sur cette page, les bandes affichent du rouge pour le test, ou du bleu si désactivé. Nécessite une carte principale avec micrologiciel v4 ou ultérieur ; les anciens tapis ne prennent pas cet éclairage en charge.\nDésactivé par défaut.
SmxUnderglowGrbHelp=Ordre des octets des couleurs des bandes lumineuses. Certaines utilisent GRB et inversent le rouge et le vert : le violet devient cyan et le vert magenta. Sur cette page, la couleur de test doit être rouge ; si elle est verte, choisissez GRB.\nRGB par défaut.
DefaultPadConfigHelp=Préréglage de seuils intégré utilisé par défaut : Faible, Moyen ou Élevé, comme dans l’outil officiel StepManiaX.\nFaible par défaut.
SmxSinglePadPlayerHelp=Avec un seul tapis StepManiaX, choisir Joueur 1 ou Joueur 2 indépendamment du cavalier matériel. Joueur 2 permet de jouer seul du côté J2.
SmxDefaultLightBrightnessHelp=Luminosité StepManiaX par défaut, de 0 % (éteint) à 100 %. Appliquée aux nouveaux profils ; chaque joueur peut ensuite la modifier dans ses options.\n100 % par défaut.
SmxBgPackHelp=Pack GIF des animations de fond sur tout le tapis. Par défaut, utiliser le pack commun intégré. Placez vos packs dans assets/smx-pad-lights/dance/<pack-name>/. Visible seulement si l’éclairage des panneaux est activé.
SmxJudgePackHelp=Pack GIF des animations de jugement par panneau. Par défaut, utiliser le pack commun intégré. Placez vos packs dans assets/smx-judge-lights/dance/<pack-name>/. Visible seulement si l’éclairage des panneaux est activé.
SmxIdleLightsHelp=Éclairage du tapis lorsqu’aucune animation GIF n’est disponible.\nMicrologiciel : reprendre les animations de repos et d’appui intégrées au tapis.\nÉteint : garder les DEL noires, tout en conservant les animations d’appui.\nVisible seulement si l’éclairage des panneaux est activé. Micrologiciel par défaut.
SmxAssignPadsHelp=Attribuer les tapis physiques à J1 et J2 en marchant sur chacun. Utile s’ils partagent le même cavalier ou sont installés du mauvais côté. Les tapis s’allument en bleu pour J1 et en rouge pour J2.
SmxSwapPadsHelp=Permuter immédiatement les tapis J1 et J2. Utile lorsque les cavaliers sont corrects mais les tapis installés du mauvais côté. Les deux tapis doivent être connectés.
DebugFsrDumpHelp=Avec des capteurs FSR, créer fsrdump.txt dans le dossier de DeadSync. Vous pouvez l’envoyer à PerfectTaste pour aider au diagnostic et à la prise en charge d’autres cartes FSR et micrologiciels.
MenuButtonsHelp=Autoriser ou non la navigation avec les touches de jeu, par exemple les flèches du tapis.\nTouches de jeu : naviguer avec le tapis de danse.\nBoutons dédiés : utiliser uniquement les boutons de menu.\nAvec les boutons dédiés, certaines actions passent de Select à Gauche+Droite simultanés.\n\nCe choix exige des boutons de menu configurés pour au moins un joueur.
OptionsNavigationHelp=Choisir comment changer de ligne dans les options des joueurs.\nStyle StepMania : Haut/Bas change de ligne et Start va à Sortie.\nStyle arcade : Start passe à la ligne suivante et une flèche vers le bas signale la ligne active.
MenuNavigationHelp=Choisir la navigation de borne à cinq ou trois boutons par joueur.\nCinq touches : MenuLeft, MenuRight, MenuUp, MenuDown et Start.\nTrois touches : MenuLeft, MenuRight et Start.\nLe mode cinq touches exige les quatre directions de menu pour au moins un joueur.\nLe mode trois touches exige MenuLeft, MenuRight et Start pour au moins un joueur.
DebounceHelp=Fenêtre d’anti-rebond par commande, appliquée aux menus et au jeu pour le clavier et tous les pilotes de manettes.\nITGmania utilise 20 ms par défaut ; 50 ms était courant sur les anciens tapis d’arcade.

